# Render Blueprint — Backend API Service
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: kalki-backend
    runtime: node
    plan: free
    buildCommand: "cd dashboard && npm install"
    startCommand: "node dashboard/server.cjs"
    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER
        value: "true"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: API_KEY_ENCRYPTION_SECRET
        sync: false
